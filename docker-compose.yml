services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/mysql

  wordpress:
    image: wordpress:${WORDPRESS_VERSION:-7.1-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    ports:
      - "${WORDPRESS_PORT:-8088}:80"
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/dubbot:ro

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    entrypoint: ["wp", "--allow-root"]
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/dubbot:ro

  mock-api:
    image: nginx:1.27-alpine
    ports:
      - "${MOCK_API_PORT:-8089}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/embeds/test-key.json"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - ./tests/fixtures/mock-api:/usr/share/nginx/html:ro

volumes:
  database:
  wordpress:
